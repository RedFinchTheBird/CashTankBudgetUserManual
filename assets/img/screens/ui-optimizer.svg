" fill="none" stroke="#1f2937" stroke-width="1.3"/><text x="96" y="424" font-size="12" fill="#1f2937">Run Plan</text><rect x="228" y="0" width="732" height="540" fill="#fefbea"/><text x="244" y="28" font-size="15" font-weight="700" fill="#1f2937">Optimizer</text><rect x="240" y="42" width="708" height="486" fill="#f3f4f6" stroke="#e5e7eb" stroke-width="1"/><rect x="746" y="12" width="200" height="22" fill="#fff7ed" stroke="#f59e0b" stroke-width="1" rx="11"/><text x="846" y="27" text-anchor="middle" font-size="11" font-weight="600" fill="#b45309">Preview - screen in progress</text><rect x="248" y="50" width="692" height="26" fill="#808080"/><text x="258" y="67" font-size="12" fill="#ffffff">Scenarios the optimizer will try</text><rect x="248" y="76" width="692" height="128" fill="#ffffff"/><text x="262" y="100" font-size="11.5" fill="#1f2937">Retirement ages 1-3 and Social Security claim ages 1-3 of each tax payer (from the Tax Payers page)</text><text x="262" y="120" font-size="11.5" fill="#1f2937">Roth conversions: none, or fill each Roth bucket below every year until RMDs start</text><text x="262" y="140" font-size="11.5" fill="#1f2937">Markets: Normal (long-run averages) and Down and flat (asset class history from the worst start year)</text><text x="262" y="180" font-size="12" font-weight="700" fill="#1d4ed8">Two tax payers with three choices each: 3 x 3 x 3 x 3 x 3 x 2 = 486 scenarios</text><rect x="248" y="218" width="340" height="26" fill="#808080"/><text x="258" y="235" font-size="12" fill="#ffffff">Roth buckets</text><rect x="248" y="244" width="340" height="72" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/><rect x="248" y="244" width="340" height="24" fill="#eef2f7" stroke="#cbd5e1" stroke-width="1"/><text x="254" y="260" text-anchor="start" font-size="11" font-weight="600" fill="#1f2937">Bucket</text><line x1="338" y1="244" x2="338" y2="316" stroke="#e5e7eb" stroke-width="1"/><text x="442" y="260" text-anchor="end" font-size="11" font-weight="600" fill="#1f2937">Bracket rate</text><line x1="448" y1="244" x2="448" y2="316" stroke="#e5e7eb" stroke-width="1"/><text x="582" y="260" text-anchor="end" font-size="11" font-weight="600" fill="#1f2937">Fill up to</text><line x1="588" y1="244" x2="588" y2="316" stroke="#e5e7eb" stroke-width="1"/><line x1="248" y1="292" x2="588" y2="292" stroke="#eef2f7" stroke-width="1"/><text x="254" y="284" text-anchor="start" font-size="11" fill="#1f2937">22%</text><text x="442" y="284" text-anchor="end" font-size="11" fill="#1f2937">22%</text><text x="582" y="284" text-anchor="end" font-size="11" fill="#1f2937">$211,400</text><line x1="248" y1="316" x2="588" y2="316" stroke="#eef2f7" stroke-width="1"/><text x="254" y="308" text-anchor="start" font-size="11" fill="#1f2937">24%</text><text x="442" y="308" text-anchor="end" font-size="11" fill="#1f2937">24%</text><text x="582" y="308" text-anchor="end" font-size="11" fill="#1f2937">$403,550</text><text x="248" y="362" font-size="10.5" fill="#6b7280">Married amounts; they follow filing status and inflation.</text><rect x="608" y="218" width="332" height="26" fill="#808080"/><text x="618" y="235" font-size="12" fill="#ffffff">Run</text><rect x="608" y="244" width="332" height="120" fill="#ffffff"/><rect x="624" y="260" width="160" height="26" fill="#2563eb" stroke="#2563eb" stroke-width="1" rx="4"/><text x="704" y="277" text-anchor="middle" font-size="11.5" font-weight="600" fill="#fff">Run Optimizer</text><text x="624" y="310" font-size="11" fill="#1f2937">Best scenario: the down-market run that lasts</text><text x="624" y="325" font-size="11" fill="#1f2937">the longest, then ends with the most money.</text><text x="624" y="340" font-size="11" fill="#1f2937">Results: Plan Results &gt; Optimizer.</text>
</svg>
