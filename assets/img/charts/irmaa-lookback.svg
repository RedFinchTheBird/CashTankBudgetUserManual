<rect width="760" height="204" fill="#ffffff"/>
<text x="16" y="26" font-size="15" font-weight="600" fill="#1f2937">The two-year lookback</text><text x="16" y="44" font-size="11.5" fill="#6b7280">Each year's income sets the Medicare premiums two years later</text><rect x="26" y="70" width="120" height="46" fill="#dbeafe" stroke="#cbd5e1" stroke-width="1.2" rx="8"/><text x="86" y="89" text-anchor="middle" font-size="13" font-weight="600" fill="#1f2937">2026</text><text x="86" y="106" text-anchor="middle" font-size="11" fill="#6b7280">income (MAGI)</text><rect x="26" y="140" width="120" height="40" fill="#bbf7d0" stroke="#cbd5e1" stroke-width="1.2" rx="8"/><text x="86" y="165" text-anchor="middle" font-size="12" font-weight="600" fill="#1f2937">2026 premiums</text><rect x="172" y="70" width="120" height="46" fill="#dbeafe" stroke="#cbd5e1" stroke-width="1.2" rx="8"/><text x="232" y="89" text-anchor="middle" font-size="13" font-weight="600" fill="#1f2937">2027</text><text x="232" y="106" text-anchor="middle" font-size="11" fill="#6b7280">income (MAGI)</text><rect x="172" y="140" width="120" height="40" fill="#bbf7d0" stroke="#cbd5e1" stroke-width="1.2" rx="8"/><text x="232" y="165" text-anchor="middle" font-size="12" font-weight="600" fill="#1f2937">2027 premiums</text><rect x="318" y="70" width="120" height="46" fill="#dbeafe" stroke="#cbd5e1" stroke-width="1.2" rx="8"/><text x="378" y="89" text-anchor="middle" font-size="13" font-weight="600" fill="#1f2937">2028</text><text x="378" y="106" text-anchor="middle" font-size="11" fill="#6b7280">income (MAGI)</text><rect x="318" y="140" width="120" height="40" fill="#bbf7d0" stroke="#cbd5e1" stroke-width="1.2" rx="8"/><text x="378" y="165" text-anchor="middle" font-size="12" font-weight="600" fill="#1f2937">2028 premiums</text><path d="M86,116 C86,130 378,126 378,139" fill="none" stroke="#475569" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="464" y="70" width="120" height="46" fill="#dbeafe" stroke="#cbd5e1" stroke-width="1.2" rx="8"/><text x="524" y="89" text-anchor="middle" font-size="13" font-weight="600" fill="#1f2937">2029</text><text x="524" y="106" text-anchor="middle" font-size="11" fill="#6b7280">income (MAGI)</text><rect x="464" y="140" width="120" height="40" fill="#bbf7d0" stroke="#cbd5e1" stroke-width="1.2" rx="8"/><text x="524" y="165" text-anchor="middle" font-size="12" font-weight="600" fill="#1f2937">2029 premiums</text><path d="M232,116 C232,130 524,126 524,139" fill="none" stroke="#475569" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="610" y="70" width="120" height="46" fill="#dbeafe" stroke="#cbd5e1" stroke-width="1.2" rx="8"/><text x="670" y="89" text-anchor="middle" font-size="13" font-weight="600" fill="#1f2937">2030</text><text x="670" y="106" text-anchor="middle" font-size="11" fill="#6b7280">income (MAGI)</text><rect x="610" y="140" width="120" height="40" fill="#bbf7d0" stroke="#cbd5e1" stroke-width="1.2" rx="8"/><text x="670" y="165" text-anchor="middle" font-size="12" font-weight="600" fill="#1f2937">2030 premiums</text><path d="M378,116 C378,130 670,126 670,139" fill="none" stroke="#475569" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="26" y="194" font-size="11" fill="#6b7280">In the planner, plan years 1 and 2 have no earlier history, so they use plan year 1's MAGI.</text>
