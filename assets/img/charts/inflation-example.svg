<rect width="760" height="300" fill="#ffffff"/>
<text x="16" y="26" font-size="15" font-weight="600" fill="#1f2937">Amounts are entered in today's dollars and inflated each year</text><text x="16" y="44" font-size="11.5" fill="#6b7280">$60,000 of living expenses with a 3% inflation rate</text><line x1="70" y1="254" x2="630" y2="254" stroke="#e5e7eb" stroke-width="1"/><text x="62" y="258" text-anchor="end" font-size="11" fill="#6b7280">$0</text><line x1="70" y1="190.7" x2="630" y2="190.7" stroke="#e5e7eb" stroke-width="1"/><text x="62" y="194.7" text-anchor="end" font-size="11" fill="#6b7280">$50k</text><line x1="70" y1="127.3" x2="630" y2="127.3" stroke="#e5e7eb" stroke-width="1"/><text x="62" y="131.3" text-anchor="end" font-size="11" fill="#6b7280">$100k</text><line x1="70" y1="64" x2="630" y2="64" stroke="#e5e7eb" stroke-width="1"/><text x="62" y="68" text-anchor="end" font-size="11" fill="#6b7280">$150k</text><text x="70" y="271" text-anchor="middle" font-size="11" fill="#6b7280">Year 1</text><text x="147.2" y="271" text-anchor="middle" font-size="11" fill="#6b7280">Year 5</text><text x="243.8" y="271" text-anchor="middle" font-size="11" fill="#6b7280">Year 10</text><text x="340.3" y="271" text-anchor="middle" font-size="11" fill="#6b7280">Year 15</text><text x="436.9" y="271" text-anchor="middle" font-size="11" fill="#6b7280">Year 20</text><text x="533.4" y="271" text-anchor="middle" font-size="11" fill="#6b7280">Year 25</text><text x="630" y="271" text-anchor="middle" font-size="11" fill="#6b7280">Year 30</text><path d="M70,178 L89.3,175.7 L108.6,173.4 L127.9,171 L147.2,168.5 L166.6,165.9 L185.9,163.3 L205.2,160.5 L224.5,157.7 L243.8,154.8 L263.1,151.9 L282.4,148.8 L301.7,145.6 L321,142.4 L340.3,139 L359.7,135.6 L379,132 L398.3,128.4 L417.6,124.6 L436.9,120.7 L456.2,116.7 L475.5,112.6 L494.8,108.4 L514.1,104 L533.4,99.5 L552.8,94.9 L572.1,90.1 L591.4,85.2 L610.7,80.1 L630,74.9" fill="none" stroke="#f59e0b" stroke-width="3" stroke-linejoin="round"/><text x="638" y="78.9" font-size="12" font-weight="700" fill