<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" width="760" height="300" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" role="img">
<title>Yearly steps</title>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker></defs>
<rect width="760" height="300" fill="#ffffff"/>
<text x="16" y="26" font-size="15" font-weight="600" fill="#1f2937">What the planner does each year</text><text x="16" y="44" font-size="11.5" fill="#6b7280">Plan year 1 is the current year; the steps repeat until the last life expectancy year</text><rect x="16" y="66" width="164" height="76" fill="#dbeafe" stroke="#cbd5e1" stroke-width="1.2" rx="8"/><text x="98" y="90" text-anchor="middle" font-size="13" font-weight="600" fill="#1f2937">1 Market</text><text x="98" y="107" text-anchor="middle" font-size="11" fill="#6b7280">growth + yield on</text><text x="98" y="121" text-anchor="middle" font-size="11" fill="#6b7280">each investment</text><line x1="182" y1="104" x2="200" y2="104" stroke="#475569" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="202" y="66" width="164" height="76" fill="#dbeafe" stroke="#cbd5e1" stroke-width="1.2" rx="8"/><text x="284" y="90" text-anchor="middle" font-size="13" font-weight="600" fill="#1f2937">2 Income</text><text x="284" y="107" text-anchor="middle" font-size="11" fill="#6b7280">wages and pensions</text><text x="284" y="121" text-anchor="middle" font-size="11" fill="#6b7280">into their accounts</text><line x1="368" y1="104" x2="386" y2="104" stroke="#475569" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="388" y="66" width="164" height="76" fill="#dbeafe" stroke="#cbd5e1" stroke-width="1.2" rx="8"/><text x="470" y="90" text-anchor="middle" font-size="13" font-weight="600" fill="#1f2937">3 Social Security</text><text x="470" y="107" text-anchor="middle" font-size="11" fill="#6b7280">benefits into the</text><text x="470" y="121" text-anchor="middle" font-size="11" fill="#6b7280">cash account</text><line x1="554" y1="104" x2="572" y2="104" stroke="#475569" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="574" y="66" width="164" height="76" fill="#dbeafe" stroke="#cbd5e1" stroke-width="1.2" rx="8"/><text x="656" y="90" text-anchor="middle" font-size="13" font-weight="600" fill="#1f2937">4 RMDs</text><text x="656" y="107" text-anchor="middle" font-size="11" fill="#6b7280">IRA / 401(k) minimum</text><text x="656" y="121" text-anchor="middle" font-size="11" fill="#6b7280">into the cash account</text><line x1="656" y1="144" x2="656" y2="174" stroke="#475569" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="574" y="176" width="164" height="76" fill="#dbeafe" stroke="#cbd5e1" stroke-width="1.2" rx="8"/><text x="656" y="200" text-anchor="middle" font-size="13" font-weight="600" fill="#1f2937">5 Expenses</text><text x="656" y="217" text-anchor="middle" font-size="11" fill="#6b7280">from an account</text><text x="656" y="231" text-anchor="middle" font-size="11" fill="#6b7280">or Auto</text><line x1="572" y1="214" x2="554" y2="214" stroke="#475569" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="388" y="176" width="164" height="76" fill="#dbeafe" stroke="#cbd5e1" stroke-width="1.2" rx="8"/><text x="470" y="200" text-anchor="middle" font-size="13" font-weight="600" fill="#1f2937">6 Taxes + Medicare</text><text x="470" y="217" text-anchor="middle" font-size="11" fill="#6b7280">last year's taxes,</text><text x="470" y="231" text-anchor="middle" font-size="11" fill="#6b7280">this year's IRMAA</text><line x1="386" y1="214" x2="368" y2="214" stroke="#475569" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="202" y="176" width="164" height="76" fill="#dbeafe" stroke="#cbd5e1" stroke-width="1.2" rx="8"/><text x="284" y="200" text-anchor="middle" font-size="13" font-weight="600" fill="#1f2937">7 Roth conversions</text><text x="284" y="217" text-anchor="middle" font-size="11" fill="#6b7280">fill the chosen</text><text x="284" y="231" text-anchor="middle" font-size="11" fill="#6b7280">bracket, last</text><line x1="200" y1="214" x2="182" y2="214" stroke="#475569" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="16" y="176" width="164" height="76" fill="#bbf7d0" stroke="#cbd5e1" stroke-width="1.2" rx="8"/><text x="98" y="200" text-anchor="middle" font-size="13" font-weight="600" fill="#1f2937">Close the year</text><text x="98" y="217" text-anchor="middle" font-size="11" fill="#6b7280">this year's tax (paid</text><text x="98" y="231" text-anchor="middle" font-size="11" fill="#6b7280">next year), NAV, forms</text><path d="M16,214 C0,214 0,104 14,104" fill="none" stroke="#475569" stroke-width="1.4" stroke-linejoin="round" stroke-dasharray="4 3" marker-end="url(#arrow)"/><text x="16" y="290" font-size="11.5" fill="#6b7280">Next year: amounts inflate, ages advance. The plan stops early if Auto cannot pay a bill.</text>
</svg>
