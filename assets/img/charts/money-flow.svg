<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 370" width="760" height="370" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" role="img">
<title>Money flow</title>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker></defs>
<rect width="760" height="370" fill="#ffffff"/>
<text x="16" y="26" font-size="15" font-weight="600" fill="#1f2937">How money moves through the plan</text><text x="16" y="44" font-size="11.5" fill="#6b7280">Inflows land in accounts; bills are paid from a chosen account or by Auto</text><rect x="16" y="66" width="160" height="54" fill="#bbf7d0" stroke="#cbd5e1" stroke-width="1.2" rx="8"/><text x="96" y="88" text-anchor="middle" font-size="13" font-weight="600" fill="#1f2937">Wages</text><text x="96" y="105" text-anchor="middle" font-size="11" fill="#6b7280">until retirement</text><rect x="16" y="136" width="160" height="54" fill="#bbf7d0" stroke="#cbd5e1" stroke-width="1.2" rx="8"/><text x="96" y="158" text-anchor="middle" font-size="13" font-weight="600" fill="#1f2937">Pensions</text><text x="96" y="175" text-anchor="middle" font-size="11" fill="#6b7280">from retirement</text><rect x="16" y="206" width="160" height="54" fill="#bbf7d0" stroke="#cbd5e1" stroke-width="1.2" rx="8"/><text x="96" y="228" text-anchor="middle" font-size="13" font-weight="600" fill="#1f2937">Social Security</text><text x="96" y="245" text-anchor="middle" font-size="11" fill="#6b7280">from the claim age</text><rect x="16" y="276" width="160" height="54" fill="#bbf7d0" stroke="#cbd5e1" stroke-width="1.2" rx="8"/><text x="96" y="298" text-anchor="middle" font-size="13" font-weight="600" fill="#1f2937">RMDs</text><text x="96" y="315" text-anchor="middle" font-size="11" fill="#6b7280">from the RMD age</text><rect x="286" y="66" width="190" height="264" fill="#dbeafe" stroke="#cbd5e1" stroke-width="1" rx="10"/><text x="381" y="90" text-anchor="middle" font-size="14" font-weight="700" fill="#1f2937">Accounts</text><text x="381" y="112" text-anchor="middle" font-size="11.5" fill="#1f2937">Savings, Checking, Brokerage</text><text x="381" y="128" text-anchor="middle" font-size="11.5" fill="#1f2937">IRA, 401(k), Roth, HSA, 529</text><text x="381" y="144" text-anchor="middle" font-size="11.5" fill="#1f2937"></text><text x="381" y="160" text-anchor="middle" font-size="11.5" fill="#1f2937">each holds investments that</text><text x="381" y="176" text-anchor="middle" font-size="11.5" fill="#1f2937">grow and pay yield every year</text><text x="381" y="192" text-anchor="middle" font-size="11.5" fill="#1f2937"></text><text x="381" y="208" text-anchor="middle" font-size="11.5" fill="#1f2937">Roth conversions move money</text><text x="381" y="224" text-anchor="middle" font-size="11.5" fill="#1f2937">IRA / 401(k) -&gt; Roth</text><text x="381" y="278" text-anchor="middle" font-size="10.5" fill="#6b7280">SS and RMDs go to the cash account:</text><text x="381" y="291" text-anchor="middle" font-size="10.5" fill="#6b7280">first Savings, then Checking,</text><text x="381" y="304" text-anchor="middle" font-size="10.5" fill="#6b7280">then Brokerage</text><rect x="584" y="66" width="160" height="54" fill="#fde68a" stroke="#cbd5e1" stroke-width="1.2" rx="8"/><text x="664" y="88" text-anchor="middle" font-size="13" font-weight="600" fill="#1f2937">Living expenses</text><text x="664" y="105" text-anchor="middle" font-size="11" fill="#6b7280">from an account or Auto</text><rect x="584" y="136" width="160" height="54" fill="#fde68a" stroke="#cbd5e1" stroke-width="1.2" rx="8"/><text x="664" y="158" text-anchor="middle" font-size="13" font-weight="600" fill="#1f2937">Federal income tax</text><text x="664" y="175" text-anchor="middle" font-size="11" fill="#6b7280">paid by Auto</text><rect x="584" y="206" width="160" height="54" fill="#fde68a" stroke="#cbd5e1" stroke-width="1.2" rx="8"/><text x="664" y="228" text-anchor="middle" font-size="13" font-weight="600" fill="#1f2937">State income tax</text><text x="664" y="245" text-anchor="middle" font-size="11" fill="#6b7280">paid by Auto</text><rect x="584" y="276" width="160" height="54" fill="#fde68a" stroke="#cbd5e1" stroke-width="1.2" rx="8"/><text x="664" y="298" text-anchor="middle" font-size="13" font-weight="600" fill="#1f2937">Medicare premiums</text><text x="664" y="315" text-anchor="middle" font-size="11" fill="#6b7280">from 65, paid by Auto</text><line x1="178" y1="93" x2="282" y2="120" stroke="#475569" stroke-width="1.4" marker-end="url(#arrow)"/><line x1="178" y1="163" x2="282" y2="170" stroke="#475569" stroke-width="1.4" marker-end="url(#arrow)"/><line x1="178" y1="233" x2="282" y2="220" stroke="#475569" stroke-width="1.4" marker-end="url(#arrow)"/><line x1="178" y1="303" x2="282" y2="270" stroke="#475569" stroke-width="1.4" marker-end="url(#arrow)"/><line x1="478" y1="120" x2="580" y2="93" stroke="#475569" stroke-width="1.4" marker-end="url(#arrow)"/><line x1="478" y1="170" x2="580" y2="163" stroke="#475569" stroke-width="1.4" marker-end="url(#arrow)"/><line x1="478" y1="220" x2="580" y2="233" stroke="#475569" stroke-width="1.4" marker-end="url(#arrow)"/><line x1="478" y1="270" x2="580" y2="303" stroke="#475569" stroke-width="1.4" marker-end="url(#arrow)"/>
</svg>
