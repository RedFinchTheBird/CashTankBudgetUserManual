<text x="16" y="26" font-size="15" font-weight="600" fill="#1f2937">Senior deduction phase-out (2025-2028)</text><text x="16" y="44" font-size="11.5" fill="#6b7280">$6,000 per person 65 or older, reduced by 6% of AGI above $75,000 (single) / $150,000 (married)</text><line x1="70" y1="274" x2="630" y2="274" stroke="#e5e7eb" stroke-width="1"/><text x="62" y="278" text-anchor="end" font-size="11" fill="#6b7280">$0</text><line x1="70" y1="225.5" x2="630" y2="225.5" stroke="#e5e7eb" stroke-width="1"/><text x="62" y="229.5" text-anchor="end" font-size="11" fill="#6b7280">$3k</text><line x1="70" y1="177.1" x2="630" y2="177.1" stroke="#e5e7eb" stroke-width="1"/><text x="62" y="181.1" text-anchor="end" font-size="11" fill="#6b7280">$6k</text><line x1="70" y1="128.6" x2="630" y2="128.6" stroke="#e5e7eb" stroke-width="1"/><text x="62" y="132.6" text-anchor="end" font-size="11" fill="#6b7280">$9k</text><line x1="70" y1="80.2" x2="630" y2="80.2" stroke="#e5e7eb" stroke-width="1"/><text x="62" y="84.2" text-anchor="end" font-size="11" fill="#6b7280">$12k</text><text x="70" y="290" text-anchor="middle" font-size="11" fill="#6b7280">$0</text><text x="163.3" y="290" text-anchor="middle" font-size="11" fill="#6b7280">$50k</text><text x="256.7" y="290" text-anchor="middle" font-size="11" fill="#6b7280">$100k</text><text x="350" y="290" text-anchor="middle" font-size="11" fill="#6b7280">$150k</text><text x="443.3" y="290" text-anchor="middle" font-size="11" fill="#6b7280">$200k</text><text x="536.7" y="290" text-anchor="middle" font-size="11" fill="#6b7280">$250k</text><text x="630" y="290" text-anchor="middle" font-size="11" fill="#6b7280">$300k</text><path d="M70,80.2 L350,80.2 L536.7,274 L630,274" fill="none" stroke="#22c55e" stroke-width="3" stroke-linejoin="round"/><path d="M70,177.1 L350,177.1 L536.7,274 L630,274" fill="none" stroke="#f59e0b" stroke-width="3" stroke-linejoin="round" stroke-dasharray="7 4"/><path d="M70,177.1 L210,177.1 L396.7,274 L630,274" fill="none" stroke="#3b