<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 250" width="760" height="250" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" role="img">
<title>Auto withdrawal order</title>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker></defs>
<rect width="760" height="250" fill="#ffffff"/>
<text x="16" y="26" font-size="15" font-weight="600" fill="#1f2937">Auto withdrawal order</text><text x="16" y="44" font-size="11.5" fill="#6b7280">When an expense, tax or Medicare bill is paid by Auto, accounts are used in this order</text><rect x="16" y="70" width="126" height="74" fill="#dbeafe" stroke="#cbd5e1" stroke-width="1.2" rx="8"/><text x="79" y="94" text-anchor="middle" font-size="13" font-weight="600" fill="#1f2937">1. Savings</text><text x="79" y="111" text-anchor="middle" font-size="11" fill="#6b7280">and Checking: interest</text><text x="79" y="125" text-anchor="middle" font-size="11" fill="#6b7280">taxed as it is earned</text><line x1="144" y1="107" x2="163" y2="107" stroke="#475569" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="166" y="70" width="126" height="74" fill="#dbeafe" stroke="#cbd5e1" stroke-width="1.2" rx="8"/><text x="229" y="94" text-anchor="middle" font-size="13" font-weight="600" fill="#1f2937">2. Brokerage</text><text x="229" y="111" text-anchor="middle" font-size="11" fill="#6b7280">gains on sales</text><text x="229" y="125" text-anchor="middle" font-size="11" fill="#6b7280">(1040 line 7a)</text><line x1="294" y1="107" x2="313" y2="107" stroke="#475569" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="316" y="70" width="126" height="74" fill="#dbeafe" stroke="#cbd5e1" stroke-width="1.2" rx="8"/><text x="379" y="94" text-anchor="middle" font-size="13" font-weight="600" fill="#1f2937">3. IRA</text><text x="379" y="111" text-anchor="middle" font-size="11" fill="#6b7280">ordinary income</text><text x="379" y="125" text-anchor="middle" font-size="11" fill="#6b7280">(1040 line 4a)</text><line x1="444" y1="107" x2="463" y2="107" stroke="#475569" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="466" y="70" width="126" height="74" fill="#dbeafe" stroke="#cbd5e1" stroke-width="1.2" rx="8"/><text x="529" y="94" text-anchor="middle" font-size="13" font-weight="600" fill="#1f2937">4. 401(k)</text><text x="529" y="111" text-anchor="middle" font-size="11" fill="#6b7280">ordinary income</text><text x="529" y="125" text-anchor="middle" font-size="11" fill="#6b7280">(1040 line 5a)</text><line x1="594" y1="107" x2="613" y2="107" stroke="#475569" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="616" y="70" width="126" height="74" fill="#bbf7d0" stroke="#cbd5e1" stroke-width="1.2" rx="8"/><text x="679" y="94" text-anchor="middle" font-size="13" font-weight="600" fill="#1f2937">5. Roth</text><text x="679" y="111" text-anchor="middle" font-size="11" fill="#6b7280">tax free</text><text x="16" y="178" font-size="11.5" fill="#1f2937">Within a step, every account and investment pays in proportion to its balance; investments that lost value this year are used last.</text><text x="16" y="196" font-size="11.5" fill="#1f2937">Savings and Checking are one step. HSA and 529 are not used by Auto. If Auto cannot cover a bill, the plan ends that year.</text>
</svg>
