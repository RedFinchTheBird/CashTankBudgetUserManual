<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 224" width="760" height="224" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" role="img">
