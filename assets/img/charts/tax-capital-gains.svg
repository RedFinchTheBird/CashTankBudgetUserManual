<text x="16" y="26" font-size="15" font-weight="600" fill="#1f2937">Capital gains and qualified dividends stack on top of ordinary income</text><text x="16" y="44" font-size="11.5" fill="#6b7280">Single, 2026: $40,000 of ordinary taxable income plus $20,000 of long-term gains / qualified dividends</text><rect x="30" y="96" width="400" height="44" fill="#60a5fa" stroke="#fff" stroke-width="2"/><text x="230" y="86" text-anchor="middle" font-size="11.5" font-weight="600" fill="#1f2937">Ordinary income</text><text x="230" y="158" text-anchor="middle" font-size="11" fill="#1f2937">taxed 10% / 12%: $4,552</text><rect x="430" y="96" width="94.5" height="44" fill="#22c55e" stroke="#fff" stroke-width="2"/><text x="477.3" y="86" text-anchor="middle" font-size="11.5" font-weight="600" fill="#1f2937">Gains at 0%</text><text x="477.3" y="158" text-anchor="middle" font-size="11" fill="#1f2937">$9,450: $0</text><rect x="524.5" y="96" width="105.5" height="44" fill="#f59e0b" stroke="#fff" stroke-width="2"/><text x="577.3" y="86" text-anchor="middle" font-size="11.5" font-weight="600" fill="#1f2937">Gains at 15%</text><text x="577.3" y="158" text-anchor="middle" font-size="11" fill="#1f2937">$10,550: $1,583</text><line x1="524.5" y1="66" x2="524.5" y2="170" stroke="#ef4444" stroke-width="1.5" stroke-dasharray="5 3"/><text x="530.5" y="66" font-size="11" fill="#ef4444">$49,450: top of the 0% capital gain bracket</text><text x="30" y="188" text-anchor="middle" font-size="10.5" fill="#6b7280">$0</text><text x="130" y="188" text-anchor="middle" font-size="10.5" fill="#6b7280">$10k</text><text x="230" y="188" text-anchor="middle" font-size="10.5" fill="#6b7280">$20k</text><text x="330" y="188" text-anchor="middle" font-size="10.5" fill="#6b7280">$30k</text><text x="430" y="188" text-anchor="middle" font-size="10.5" fill="#6b7280">$40k</text><text x="530" y="188" text-anchor="middle" font-size="10.5" fill="#6b7280">$50k</text><text x="630" y="188" text-anchor="middle" font-size="10.5" fill="#6b7280">$60k</text><text x="730" y="188" text-anchor="middle" font-size="10.5" fill="#6b7280">$70k</text>
