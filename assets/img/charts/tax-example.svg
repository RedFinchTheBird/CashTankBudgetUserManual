<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 250" width="760" height="250" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" role="img">
<title>Federal tax example</title>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker></defs>
<rect width="760" height="250" fill="#ffffff"/>
<text x="16" y="26" font-size="15" font-weight="600" fill="#1f2937">Example: federal tax on $100,000 of wages (single, 2026)</text><text x="16" y="44" font-size="11.5" fill="#6b7280">Each slice of income is taxed at its own bracket rate - only the top slice pays the top rate</text><rect x="30" y="92" width="112.7" height="44" fill="#cbd5e1" stroke="#ffffff" stroke-width="2"/><text x="86.3" y="68" text-anchor="middle" font-size="11" fill="#1f2937">Standard deduction</text><text x="86.3" y="81" text-anchor="middle" font-size="11" fill="#1f2937">$16,100</text><text x="86.3" y="154" text-anchor="middle" font-size="11.5" font-weight="600" fill="#6b7280">no tax</text><rect x="142.7" y="92" width="86.8" height="44" fill="#bfdbfe" stroke="#ffffff" stroke-width="2"/><text x="186.1" y="68" text-anchor="middle" font-size="11" fill="#1f2937">10% bracket</text><text x="186.1" y="81" text-anchor="middle" font-size="11" fill="#1f2937">$12,400</text><text x="186.1" y="154" text-anchor="middle" font-size="11.5" font-weight="600" fill="#1d4ed8">tax $1,240</text><rect x="229.5" y="92" width="266" height="44" fill="#60a5fa" stroke="#ffffff" stroke-width="2"/><text x="362.5" y="68" text-anchor="middle" font-size="11" fill="#1f2937">12% bracket</text><text x="362.5" y="81" text-anchor="middle" font-size="11" fill="#1f2937">$38,000</text><text x="362.5" y="154" text-anchor="middle" font-size="11.5" font-weight="600" fill="#1d4ed8">tax $4,560</text><rect x="495.5" y="92" width="234.5" height="44" fill="#3b82f6" stroke="#ffffff" stroke-width="2"/><text x="612.8" y="68" text-anchor="middle" font-size="11" fill="#1f2937">22% bracket</text><text x="612.8" y="81" text-anchor="middle" font-size="11" fill="#1f2937">$33,500</text><text x="612.8" y="154" text-anchor="middle" font-size="11.5" font-weight="600" fill="#1d4ed8">tax $7,370</text><text x="30" y="188" font-size="12.5" font-weight="600" fill="#1f2937">Taxable income $83,900   |   Federal tax $13,170   |   Marginal rate 22%   |   Effective rate 13.2% of wages</text>
</svg>
