-anchor="middle" font-size="10.5" fill="#1f2937">ages</text><text x="466" y="112" text-anchor="middle" font-size="16" font-weight="700" fill="#475569">x</text><rect x="478" y="66" width="92" height="84" fill="#dbeafe" stroke="#cbd5e1" stroke-width="1" rx="8"/><text x="524" y="98" text-anchor="middle" font-size="24" font-weight="700" fill="#1d4ed8">3</text><text x="524" y="118" text-anchor="middle" font-size="10.5" fill="#1f2937">Roth: none,</text><text x="524" y="131" text-anchor="middle" font-size="10.5" fill="#1f2937">22%, 24%</text><text x="582" y="112" text-anchor="middle" font-size="16" font-weight="700" fill="#475569">x</text><rect x="594" y="66" width="92" height="84" fill="#dbeafe" stroke="#cbd5e1" stroke-width="1" rx="8"/><text x="640" y="98" text-anchor="middle" font-size="24" font-weight="700" fill="#1d4ed8">2</text><text x="640" y="118" text-anchor="middle" font-size="10.5" fill="#1f2937">markets:</text><text x="640" y="131" text-anchor="middle" font-size="10.5" fill="#1f2937">normal, down</text><text x="380" y="186" text-anchor="middle" font-size="16" font-weight="700" fill="#1d4ed8">= 486 scenarios with two tax payers</text><text x="380" y="212" text-anchor="middle" font-size="12" fill="#6b7280">One tax payer: 3 x 3 x 3 x 2 = 54 scenarios. Repeated ages count once.</text>
