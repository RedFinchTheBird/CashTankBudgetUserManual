<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 170" width="760" height="170" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" role="img">
<title>RMD start age by birth year</title>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker></defs>
<rect width="760" height="170" fill="#ffffff"/>
<text x="16" y="26" font-size="15" font-weight="600" fill="#1f2937">When RMDs start (SECURE 2.0)</text><text x="16" y="44" font-size="11.5" fill="#6b7280">The planner picks the start age from each tax payer's year of birth</text><rect x="20" y="66" width="225" height="76" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2" rx="8"/><text x="132.5" y="96" text-anchor="middle" font-size="13" font-weight="600" fill="#1f2937">Born 1950 or earlier</text><text x="132.5" y="113" text-anchor="middle" font-size="14" fill="#1d4ed8">RMDs start at 72</text><line x1="248" y1="104" x2="262" y2="104" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="265" y="66" width="225" height="76" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2" rx="8"/><text x="377.5" y="96" text-anchor="middle" font-size="13" font-weight="600" fill="#1f2937">Born 1951 - 1959</text><text x="377.5" y="113" text-anchor="middle" font-size="14" fill="#1d4ed8">RMDs start at 73</text><line x1="493" y1="104" x2="507" y2="104" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="510" y="66" width="225" height="76" fill="#dbeafe" stroke="#cbd5e1" stroke-width="1.2" rx="8"/><text x="622.5" y="96" text-anchor="middle" font-size="13" font-weight="600" fill="#1f2937">Born 1960 or later</text><text x="622.5" y="113" text-anchor="middle" font-size="14" fill="#1d4ed8">RMDs start at 75</text>
</svg>
