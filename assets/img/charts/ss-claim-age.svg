<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 320" width="760" height="320" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" role="img">
<title>Monthly benefit by claim age</title>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker></defs>
<rect width="760" height="320" fill="#ffffff"/>
<text x="16" y="26" font-size="15" font-weight="600" fill="#1f2937">Monthly benefit by claim age</text><text x="16" y="44" font-size="11.5" fill="#6b7280">Example: $2,100 at 62 (minimum), $3,000 at 67 (full), $3,720 at 70 (maximum); ages in between are interpolated</text><line x1="70" y1="264" x2="710" y2="264" stroke="#e5e7eb" stroke-width="1"/><text x="62" y="268" text-anchor="end" font-size="11" fill="#6b7280">$0</text><line x1="70" y1="214" x2="710" y2="214" stroke="#e5e7eb" stroke-width="1"/><text x="62" y="218" text-anchor="end" font-size="11" fill="#6b7280">$1k</text><line x1="70" y1="164" x2="710" y2="164" stroke="#e5e7eb" stroke-width="1"/><text x="62" y="168" text-anchor="end" font-size="11" fill="#6b7280">$2k</text><line x1="70" y1="114" x2="710" y2="114" stroke="#e5e7eb" stroke-width="1"/><text x="62" y="118" text-anchor="end" font-size="11" fill="#6b7280">$3k</text><line x1="70" y1="64" x2="710" y2="64" stroke="#e5e7eb" stroke-width="1"/><text x="62" y="68" text-anchor="end" font-size="11" fill="#6b7280">$4k</text><rect x="84.2" y="159" width="42.7" height="105" fill="#f59e0b" rx="2"/><text x="105.6" y="153" text-anchor="middle" font-size="11" font-weight="600" fill="#1f2937">$2,100</text><text x="105.6" y="281" text-anchor="middle" font-size="11.5" fill="#1f2937">62</text><rect x="155.3" y="150" width="42.7" height="114" fill="#60a5fa" rx="2"/><text x="176.7" y="144" text-anchor="middle" font-size="11" font-weight="600" fill="#1f2937">$2,280</text><text x="176.7" y="281" text-anchor="middle" font-size="11.5" fill="#1f2937">63</text><rect x="226.4" y="141" width="42.7" height="123" fill="#60a5fa" rx="2"/><text x="247.8" y="135" text-anchor="middle" font-size="11" font-weight="600" fill="#1f2937">$2,460</text><text x="247.8" y="281" text-anchor="middle" font-size="11.5" fill="#1f2937">64</text><rect x="297.6" y="132" width="42.7" height="132" fill="#60a5fa" rx="2"/><text x="318.9" y="126" text-anchor="middle" font-size="11" font-weight="600" fill="#1f2937">$2,640</text><text x="318.9" y="281" text-anchor="middle" font-size="11.5" fill="#1f2937">65</text><rect x="368.7" y="123" width="42.7" height="141" fill="#60a5fa" rx="2"/><text x="390" y="117" text-anchor="middle" font-size="11" font-weight="600" fill="#1f2937">$2,820</text><text x="390" y="281" text-anchor="middle" font-size="11.5" fill="#1f2937">66</text><rect x="439.8" y="114" width="42.7" height="150" fill="#1d4ed8" rx="2"/><text x="461.1" y="108" text-anchor="middle" font-size="11" font-weight="600" fill="#1f2937">$3,000</text><text x="461.1" y="281" text-anchor="middle" font-size="11.5" fill="#1f2937">67</text><rect x="510.9" y="102" width="42.7" height="162" fill="#60a5fa" rx="2"/><text x="532.2" y="96" text-anchor="middle" font-size="11" font-weight="600" fill="#1f2937">$3,240</text><text x="532.2" y="281" text-anchor="middle" font-size="11.5" fill="#1f2937">68</text><rect x="582" y="90" width="42.7" height="174" fill="#60a5fa" rx="2"/><text x="603.3" y="84" text-anchor="middle" font-size="11" font-weight="600" fill="#1f2937">$3,480</text><text x="603.3" y="281" text-anchor="middle" font-size="11.5" fill="#1f2937">69</text><rect x="653.1" y="78" width="42.7" height="186" fill="#22c55e" rx="2"/><text x="674.4" y="72" text-anchor="middle" font-size="11" font-weight="600" fill="#1f2937">$3,720</text><text x="674.4" y="281" text-anchor="middle" font-size="11.5" fill="#1f2937">70</text><text x="390" y="310" text-anchor="middle" font-size="11" fill="#6b7280">Claim age</text>
</svg>
