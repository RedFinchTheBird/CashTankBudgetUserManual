<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 420" width="760" height="420" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" role="img">
<title>2026 federal tax brackets</title>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker></defs>
<rect width="760" height="420" fill="#ffffff"/>
<text x="16" y="26" font-size="15" font-weight="600" fill="#1f2937">2026 federal marginal tax rate by taxable income</text><text x="16" y="44" font-size="11.5" fill="#6b7280">The rate that applies to the next dollar of taxable income (after deductions)</text><line x1="56" y1="289" x2="706" y2="289" stroke="#e5e7eb" stroke-width="1"/><text x="48" y="293" text-anchor="end" font-size="11" fill="#6b7280">10%</text><line x1="56" y1="274" x2="706" y2="274" stroke="#e5e7eb" stroke-width="1"/><text x="48" y="278" text-anchor="end" font-size="11" fill="#6b7280">12%</text><line x1="56" y1="199" x2="706" y2="199" stroke="#e5e7eb" stroke-width="1"/><text x="48" y="203" text-anchor="end" font-size="11" fill="#6b7280">22%</text><line x1="56" y1="184" x2="706" y2="184" stroke="#e5e7eb" stroke-width="1"/><text x="48" y="188" text-anchor="end" font-size="11" fill="#6b7280">24%</text><line x1="56" y1="124" x2="706" y2="124" stroke="#e5e7eb" stroke-width="1"/><text x="48" y="128" text-anchor="end" font-size="11" fill="#6b7280">32%</text><line x1="56" y1="101.5" x2="706" y2="101.5" stroke="#e5e7eb" stroke-width="1"/><text x="48" y="105.5" text-anchor="end" font-size="11" fill="#6b7280">35%</text><line x1="56" y1="86.5" x2="706" y2="86.5" stroke="#e5e7eb" stroke-width="1"/><text x="48" y="90.5" text-anchor="end" font-size="11" fill="#6b7280">37%</text><text x="56" y="380" text-anchor="middle" font-size="11" fill="#6b7280">$0</text><text x="210.8" y="380" text-anchor="middle" font-size="11" fill="#6b7280">$100k</text><text x="365.5" y="380" text-anchor="middle" font-size="11" fill="#6b7280">$200k</text><text x="520.3" y="380" text-anchor="middle" font-size="11" fill="#6b7280">$300k</text><text x="675" y="380" text-anchor="middle" font-size="11" fill="#6b7280">$400k</text><text x="829.8" y="380" text-anchor="middle" font-size="11" fill="#6b7280">$500k</text><path d="M56,289 L94.4,289 L94.4,274 L212,274 L212,199 L383.2,199 L383.2,184 L680.5,184 L680.5,124 L706,124" fill="none" stroke="#f59e0b" stroke-width="3" stroke-linejoin="round"/><path d="M56,289 L75.2,289 L75.2,274 L134,274 L134,199 L219.6,199 L219.6,184 L368.3,184 L368.3,124 L452.5,124 L452.5,101.5 L706,101.5" fill="none" stroke="#3b82f6" stroke-width="3" stroke-linejoin="round"/><line x1="56" y1="364" x2="706" y2="364" stroke="#475569" stroke-width="1"/><line x1="515.6" y1="22" x2="531.6" y2="22" stroke="#3b82f6" stroke-width="3"/><text x="535.6" y="26" font-size="11.5" fill="#1f2937">Single</text><line x1="579.4" y1="22" x2="595.4" y2="22" stroke="#f59e0b" stroke-width="3"/><text x="599.4" y="26" font-size="11.5" fill="#1f2937">Married filing jointly</text><text x="56" y="410" font-size="11" fill="#6b7280">37% applies above $640,600 (single) and $768,700 (married). Bracket edges rise each year with the tax forms inflation rate.</text>
</svg>
